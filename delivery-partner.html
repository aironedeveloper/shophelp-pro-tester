<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delivery Partner Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#111827;
color:white;
position:fixed;
top:0;
left:0;
bottom:0;
padding:20px;
overflow:auto;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:25px;
}

.sidebar button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
cursor:pointer;
margin-bottom:10px;
text-align:left;
}

.sidebar button:hover{
background:#2563eb;
}

.main{
margin-left:260px;
padding:25px;
width:100%;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h4{
color:#666;
margin-bottom:10px;
}

.card h2{
font-size:30px;
}

.page{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{
display:none;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

.btn{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#16a34a;
color:white;
}

.warning{
background:#f59e0b;
color:white;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:12px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
🚚 Delivery Partner
</div>

<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>

<button onclick="showPage('available')">
📦 Available Deliveries
</button>

<button onclick="showPage('active')">
🚚 My Deliveries
</button>

<button onclick="showPage('history')">
📜 History
</button>

<button onclick="showPage('earnings')">
💰 Earnings
</button>

<button onclick="showPage('profile')">
👤 Profile
</button>

<button onclick="logoutUser()">
🚪 Logout
</button>

</div>

<div class="main">

<div class="header">

<h1 id="partnerName">
Loading...
</h1>

</div>

<div id="dashboardPage">

<div class="cards">

<div class="card">
<h4>Available Orders</h4>
<h2 id="availableCount">0</h2>
</div>

<div class="card">
<h4>Active Deliveries</h4>
<h2 id="activeCount">0</h2>
</div>

<div class="card">
<h4>Completed</h4>
<h2 id="completedCount">0</h2>
</div>

<div class="card">
<h4>Today's Earnings</h4>
<h2 id="todayEarnings">₹0</h2>
</div>

</div>

<div class="page">
<h2>Welcome Delivery Partner</h2>
<br>
<p>
Manage deliveries, earnings and delivery history.
</p>
</div>

</div>

<div id="availablePage" class="page hidden"></div>

<div id="activePage" class="page hidden"></div>

<div id="historyPage" class="page hidden"></div>

<div id="earningsPage" class="page hidden"></div>

<div id="profilePage" class="page hidden"></div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDObJ8UKlYL_M4qHmJiWgxlNJraqmDZwGc",
authDomain: "shophelpay.firebaseapp.com",
projectId: "shophelpay",
storageBucket: "shophelpay.firebasestorage.app",
messagingSenderId: "714326373961",
appId: "1:714326373961:web:7df87c2fb87f08e69e7198"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let partnerData = {};
let availableOrders = [];
let activeOrders = [];
let completedOrders = [];

window.logoutUser = async function(){

await signOut(auth);

location.href =
"delivery-partner-login.html";

};

window.showPage = function(page){

document.getElementById("dashboardPage")
.classList.add("hidden");

document.getElementById("availablePage")
.classList.add("hidden");

document.getElementById("activePage")
.classList.add("hidden");

document.getElementById("historyPage")
.classList.add("hidden");

document.getElementById("earningsPage")
.classList.add("hidden");

document.getElementById("profilePage")
.classList.add("hidden");

document.getElementById(page+"Page")
.classList.remove("hidden");

};

async function loadPartner(){

const uid =
auth.currentUser.uid;

const userSnap =
await getDoc(
doc(db,"users",uid)
);

if(!userSnap.exists()){

alert("User not found");
return;

}

partnerData =
userSnap.data();

if(
partnerData.role !== "delivery"
){

alert("Access denied");

location.href =
"index.html";

return;

}

document.getElementById(
"partnerName"
).innerText =
partnerData.name ||
"Delivery Partner";

try{

const ordersSnap =
await getDocs(
collection(db,"orders")
);

ordersSnap.forEach(docu=>{

const order =
{
id:docu.id,
...docu.data()
};

if(
order.status==="pending"
){

availableOrders.push(order);

}

if(
order.assignedPartnerId===uid &&
(
order.status==="assigned" ||
order.status==="picked_up" ||
order.status==="out_for_delivery"
)
){

activeOrders.push(order);

}

if(
order.assignedPartnerId===uid &&
order.status==="delivered"
){

completedOrders.push(order);

}

});

}catch(err){

console.log(err);

}

updateDashboard();

renderAvailable();

renderActive();

renderHistory();

renderEarnings();

renderProfile();

}

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

location.href =
"delivery-login.html";

return;

}

await loadPartner();

});

function updateDashboard(){

document.getElementById(
"availableCount"
).innerText =
availableOrders.length;

document.getElementById(
"activeCount"
).innerText =
activeOrders.length;

document.getElementById(
"completedCount"
).innerText =
completedOrders.length;

const earnings =
completedOrders.length * 40;

document.getElementById(
"todayEarnings"
).innerText =
"₹"+earnings;

} 
function renderAvailable(){

let html = `

<h2>Available Deliveries</h2>

<br>

<table>

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Total</th>
<th>Action</th>
</tr>

`;

availableOrders.forEach(order=>{

html += `

<tr>

<td>${order.id}</td>

<td>${order.customerName || "-"}</td>

<td>₹${order.total || 0}</td>

<td>

<button
class="btn success"
onclick="acceptDelivery('${order.id}')">

Accept

</button>

</td>

</tr>

`;

});

html += `</table>`;

document.getElementById(
"availablePage"
).innerHTML = html;

}

window.acceptDelivery =
async function(orderId){

const uid =
auth.currentUser.uid;

await updateDoc(
doc(db,"orders",orderId),
{
assignedPartnerId:uid,
status:"assigned"
}
);

alert(
"Delivery Accepted"
);

location.reload();

};

function renderActive(){

let html = `

<h2>My Deliveries</h2>

<br>

<table>

<tr>
<th>Order</th>
<th>Customer</th>
<th>Status</th>
<th>Action</th>
</tr>

`;

activeOrders.forEach(order=>{

html += `

<tr>

<td>${order.id}</td>

<td>${order.customerName || "-"}</td>

<td>${order.status}</td>

<td>

<button
class="btn primary"
onclick="updateStatus(
'${order.id}',
'picked_up'
)">

Picked Up

</button>

<button
class="btn warning"
onclick="updateStatus(
'${order.id}',
'out_for_delivery'
)">

Out For Delivery

</button>

<button
class="btn success"
onclick="updateStatus(
'${order.id}',
'delivered'
)">

Delivered

</button>

</td>

</tr>

`;

});

html += `</table>`;

document.getElementById(
"activePage"
).innerHTML = html;

}

window.updateStatus =
async function(orderId,status){

await updateDoc(
doc(db,"orders",orderId),
{
status:status
}
);

alert(
"Status Updated"
);

location.reload();

};
function renderHistory(){

let html = `

<h2>Delivery History</h2>

<br>

<table>

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Total</th>
<th>Status</th>
</tr>

`;

completedOrders.forEach(order=>{

html += `

<tr>

<td>${order.id}</td>

<td>${order.customerName || "-"}</td>

<td>₹${order.total || 0}</td>

<td>✅ Delivered</td>

</tr>

`;

});

html += `</table>`;

document.getElementById(
"historyPage"
).innerHTML = html;

}

function renderEarnings(){

const total =
completedOrders.length * 40;

document.getElementById(
"earningsPage"
).innerHTML = `

<h2>Earnings</h2>

<br>

<div class="card">

<h3>Total Deliveries</h3>

<h1>
${completedOrders.length}
</h1>

</div>

<br>

<div class="card">

<h3>Total Earnings</h3>

<h1>
₹${total}
</h1>

</div>

`;

}

function renderProfile(){

document.getElementById(
"profilePage"
).innerHTML = `

<h2>My Profile</h2>

<br>

<label>Name</label>

<input
id="nameInput"
value="${partnerData.name || ""}">

<label>Mobile</label>

<input
id="mobileInput"
value="${partnerData.mobile || ""}">

<label>Email</label>

<input
disabled
value="${partnerData.email || ""}">

<label>Vehicle Type</label>

<input
id="vehicleInput"
value="${partnerData.vehicleType || ""}">

<label>UPI ID</label>

<input
id="upiInput"
value="${partnerData.upiId || ""}">

<button
class="btn success"
onclick="saveProfile()">

Save Profile

</button>

`;

}

window.saveProfile =
async function(){

const uid =
auth.currentUser.uid;

await updateDoc(
doc(db,"users",uid),
{
name:
document.getElementById(
"nameInput"
).value,

mobile:
document.getElementById(
"mobileInput"
).value,

vehicleType:
document.getElementById(
"vehicleInput"
).value,

upiId:
document.getElementById(
"upiInput"
).value
}
);

alert(
"Profile Updated"
);

};

</script>

</body>
</html>
