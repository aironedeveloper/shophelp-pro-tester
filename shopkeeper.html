<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OnShop Shopkeeper Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#111827;
color:#fff;
position:fixed;
left:0;
top:0;
bottom:0;
padding:20px;
overflow:auto;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:25px;
}

.menu button{
width:100%;
padding:14px;
border:none;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
background:#1f2937;
color:white;
text-align:left;
font-size:15px;
}

.menu button:hover{
background:#2563eb;
}

.main{
margin-left:260px;
width:100%;
padding:25px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.shopTitle{
font-size:28px;
font-weight:700;
}

.status{
padding:8px 15px;
border-radius:25px;
font-size:13px;
font-weight:600;
}

.approved{
background:#dcfce7;
color:#166534;
}

.pending{
background:#fef3c7;
color:#92400e;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h4{
color:#666;
margin-bottom:10px;
}

.card h2{
font-size:30px;
}

.page{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{
display:none;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

.btn{
padding:8px 14px;
border:none;
border-radius:10px;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#16a34a;
color:white;
}

.danger{
background:#dc2626;
color:white;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:8px;
margin-bottom:15px;
}


</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
🛒 OnShop
</div>

<div class="menu">

<button onclick="showPage('dashboard')">
🏠 <span data-i18n="dashboard">Dashboard</span>
</button>

<button onclick="showPage('products')">
📦 <span data-i18n="products">Products</span>
</button>

<button onclick="showPage('orders')">
🛍 <span data-i18n="orders">Orders</span>
</button>

<button onclick="showPage('customers')">
👥 <span data-i18n="customers">Customers</span>
</button>

<button onclick="showPage('analytics')">
📈 <span data-i18n="analytics">Analytics</span>
</button>

<button onclick="showPage('settings')">
⚙ <span data-i18n="settings">Settings</span>
</button>

<button onclick="logoutUser()">
🚪 <span data-i18n="logout">Logout</span>
</button>

</div>

</div>

<div class="main">

<div class="header">

<div class="shopTitle" id="shopName">
Loading...
</div>

<div id="approvalBadge" class="status pending" data-i18n="pending">Pending</div>

</div>

<div id="dashboardPage">

<div class="cards">

<div class="card">
<h4 data-i18n="totalProducts">Total Products</h4>
<h2 id="totalProducts">0</h2>
</div>

<div class="card">
<h4 data-i18n="totalCustomers">Total Customers</h4>
<h2 id="totalCustomers">0</h2>
</div>

<div class="card">
<h4 data-i18n="totalSales">Total Sales</h4>
<h2 id="totalSales">0</h2>
</div>

<div class="card">
<h4 data-i18n="revenue">Revenue</h4>
<h2 id="totalRevenue">₹0</h2>
</div>

</div>

<div class="page">

<h2 data-i18n="welcome">Welcome to OnShop</h2>
<br>
<p data-i18n="manage">Manage products, orders and customers from one dashboard.</p>

</div>

</div>

<div id="productsPage" class="page hidden"></div>

<div id="ordersPage" class="page hidden"></div>

<div id="customersPage" class="page hidden"></div>

<div id="analyticsPage" class="page hidden"></div>

<div id="settingsPage" class="page hidden"></div>
<script>
/* SHOPKEEPER LANGUAGE SYSTEM - UI ONLY, NO FIRESTORE DATA TRANSLATION */
const SHOPKEEPER_TEXT = {
  en: {
    language:"Language", dashboard:"Dashboard", products:"Products", orders:"Orders",
    customers:"Customers", analytics:"Analytics", settings:"Settings", logout:"Logout",
    pending:"Pending", approved:"Approved", revenue:"Revenue", totalProducts:"Total Products",
    totalCustomers:"Total Customers", totalSales:"Total Sales", welcome:"Welcome to OnShop",
    manage:"Manage products, orders and customers from one dashboard.", name:"Name", price:"Price",
    stock:"Stock", onshop:"OnShop", action:"Action", live:"Live", off:"Off", enable:"Enable",
    disable:"Disable", debt:"Debt", totalRevenue:"Total Revenue", storeSettings:"Store Settings",
    shopName:"Shop Name", ownerName:"Owner Name", phone:"Phone", address:"Address",
    saveSettings:"Save Settings", noOrders:"No orders yet",
    ordersMessage:"Orders from OnShop customers will appear here.", settingsSaved:"Settings Saved",
    userNotFound:"User not found", accessDenied:"Access denied"
  },
  hi: {
    language:"भाषा", dashboard:"डैशबोर्ड", products:"उत्पाद", orders:"ऑर्डर",
    customers:"ग्राहक", analytics:"विश्लेषण", settings:"सेटिंग्स", logout:"लॉगआउट",
    pending:"लंबित", approved:"स्वीकृत", revenue:"राजस्व", totalProducts:"कुल उत्पाद",
    totalCustomers:"कुल ग्राहक", totalSales:"कुल बिक्री", welcome:"OnShop में आपका स्वागत है",
    manage:"एक ही डैशबोर्ड से उत्पाद, ऑर्डर और ग्राहकों को प्रबंधित करें।", name:"नाम", price:"कीमत",
    stock:"स्टॉक", onshop:"OnShop", action:"कार्य", live:"लाइव", off:"बंद", enable:"सक्षम करें",
    disable:"अक्षम करें", debt:"बकाया", totalRevenue:"कुल राजस्व", storeSettings:"दुकान की सेटिंग्स",
    shopName:"दुकान का नाम", ownerName:"मालिक का नाम", phone:"फोन", address:"पता",
    saveSettings:"सेटिंग्स सेव करें", noOrders:"अभी कोई ऑर्डर नहीं है",
    ordersMessage:"OnShop ग्राहकों के ऑर्डर यहां दिखाई देंगे।", settingsSaved:"सेटिंग्स सेव हो गईं",
    userNotFound:"यूज़र नहीं मिला", accessDenied:"पहुंच अस्वीकृत"
  }
};
let shopkeeperLanguage = localStorage.getItem("shophelp_language") || "en";
function st(key){ return (SHOPKEEPER_TEXT[shopkeeperLanguage] && SHOPKEEPER_TEXT[shopkeeperLanguage][key]) || SHOPKEEPER_TEXT.en[key] || key; }
function applyShopkeeperLanguage(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=st(el.dataset.i18n); });
  const sel=document.getElementById("shopkeeperLanguage"); if(sel) sel.value=shopkeeperLanguage;
}
function setShopkeeperLanguage(lang){
  shopkeeperLanguage = lang === "hi" ? "hi" : "en";
  localStorage.setItem("shophelp_language", shopkeeperLanguage);
  applyShopkeeperLanguage();
  // Re-render only this page's static UI. Firestore data values are inserted unchanged.
  if (typeof window.updateDashboard === "function") window.updateDashboard();
  if (typeof window.renderProducts === "function") window.renderProducts();
  if (typeof window.renderCustomers === "function") window.renderCustomers();
  if (typeof window.renderAnalytics === "function") window.renderAnalytics();
  if (typeof window.renderOrders === "function") window.renderOrders();
  if (typeof window.renderSettings === "function") window.renderSettings();

  applyShopkeeperLanguage();
}
window.setShopkeeperLanguage=setShopkeeperLanguage;
document.addEventListener("DOMContentLoaded", applyShopkeeperLanguage);
</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDObJ8UKlYL_M4qHmJiWgxlNJraqmDZwGc",
authDomain: "shophelpay.firebaseapp.com",
projectId: "shophelpay",
storageBucket: "shophelpay.firebasestorage.app",
messagingSenderId: "714326373961",
appId: "1:714326373961:web:7df87c2fb87f08e69e7198"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let shopData = {};
let userData = {};
let products = [];
let customers = [];
let sales = [];

window.logoutUser = async function(){
await signOut(auth);
location.href="shopkeeper-login.html";
};

window.showPage = function(page){

document.getElementById("dashboardPage").classList.add("hidden");
document.getElementById("productsPage").classList.add("hidden");
document.getElementById("ordersPage").classList.add("hidden");
document.getElementById("customersPage").classList.add("hidden");
document.getElementById("analyticsPage").classList.add("hidden");
document.getElementById("settingsPage").classList.add("hidden");

document.getElementById(page+"Page")
.classList.remove("hidden");

};

async function loadShop(){

const uid = auth.currentUser.uid;

const userSnap =
await getDoc(doc(db,"users",uid));

if(!userSnap.exists()){

alert(st("userNotFound"));
return;

}

userData = userSnap.data();

if(userData.role !== "shopkeeper"){

alert(st("accessDenied"));
location.href="index.html";
return;

}

document.getElementById("shopName")
.innerText =
userData.shopName || "My Shop";

if(userData.status === "approved"){

document.getElementById("approvalBadge")
.innerText = "Approved";

document.getElementById("approvalBadge")
.className =
"status approved";

}else{

document.getElementById("approvalBadge")
.innerText = "Pending";

}

const shopSnap =
await getDoc(doc(db,"shops",uid));

if(shopSnap.exists()){

shopData = shopSnap.data();

products =
shopData.products || [];

customers =
shopData.customers || [];

sales =
shopData.sales || [];

}

updateDashboard();
renderProducts();
renderCustomers();
renderAnalytics();
renderOrders();
renderSettings();
applyShopkeeperLanguage();

}

onAuthStateChanged(auth, async(user)=>{

if(!user){

location.href="shopkeeper-login.html";
return;

}

await loadShop();

});

function updateDashboard(){

document.getElementById("totalProducts")
.innerText =
products.length;

document.getElementById("totalCustomers")
.innerText =
customers.length;

document.getElementById("totalSales")
.innerText =
sales.length;

let revenue = 0;

sales.forEach(s=>{

revenue += Number(
s.total || 0
);

});

document.getElementById("totalRevenue")
.innerText =
"₹"+revenue;

}
window.renderProducts = function renderProducts(){
let html = `
<h2>${st("products")}</h2>
<br>
<table>
<tr>
<th>${st("name")}</th>
<th>${st("price")}</th>
<th>${st("stock")}</th>
<th>${st("onshop")}</th>
<th>${st("action")}</th>
</tr>
`;
products.forEach((p,index)=>{
html += `
<tr>
<td>${p.name || "-"}</td>
<td>₹${p.sp || 0}</td>
<td>${p.qty || 0}</td>
<td>${p.onshopEnabled ? "✅ " + st("live") : "❌ " + st("off")}</td>
<td><button class="btn primary" onclick="toggleProduct(${index})">${p.onshopEnabled ? st("disable") : st("enable")}</button></td>
</tr>`;
});
html += `</table>`;
document.getElementById("productsPage").innerHTML = html;
}

window.toggleProduct = async function(index){

const uid = auth.currentUser.uid;

products[index].onshopEnabled =
!products[index].onshopEnabled;

await updateDoc(
doc(db,"shops",uid),
{
products
}
);

renderProducts();

};

window.renderCustomers = function renderCustomers(){
let html = `
<h2>${st("customers")}</h2>
<br>
<table>
<tr>
<th>${st("name")}</th>
<th>${st("phone")}</th>
<th>${st("debt")}</th>
</tr>
`;
customers.forEach(c=>{
html += `
<tr>
<td>${c.name || "-"}</td>
<td>${c.phone || "-"}</td>
<td>₹${c.debt || 0}</td>
</tr>`;
});
html += `</table>`;
document.getElementById("customersPage").innerHTML = html;
}

window.renderAnalytics = function renderAnalytics(){
let revenue = 0;
sales.forEach(sale=>{ revenue += Number(sale.total || 0); });
document.getElementById("analyticsPage").innerHTML = `
<h2>${st("analytics")}</h2>
<br>
<div class="cards">
<div class="card"><h4>${st("totalRevenue")}</h4><h2>₹${revenue}</h2></div>
<div class="card"><h4>${st("totalSales")}</h4><h2>${sales.length}</h2></div>
<div class="card"><h4>${st("products")}</h4><h2>${products.length}</h2></div>
</div>`;
}

window.renderOrders = function renderOrders(){
document.getElementById("ordersPage").innerHTML = `
<h2>${st("orders")}</h2>
<br>
<div class="card">
<h3>${st("noOrders")}</h3>
<p>${st("ordersMessage")}</p>
</div>`;
}

window.renderSettings = function renderSettings(){
document.getElementById("settingsPage").innerHTML = `
<h2>${st("storeSettings")}</h2>
<br>
<label>${st("language")}</label>
<select id="shopkeeperLanguage" onchange="setShopkeeperLanguage(this.value)" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;margin-bottom:15px;">
<option value="en">English</option>
<option value="hi">हिंदी</option>
</select>
<label>${st("shopName")}</label>
<input id="shopNameInput" value="${userData.shopName || ""}">
<label>${st("ownerName")}</label>
<input id="ownerNameInput" value="${userData.ownerName || ""}">
<label>${st("phone")}</label>
<input id="phoneInput" value="${userData.phone || ""}">
<label>${st("address")}</label>
<textarea id="addressInput">${userData.address || ""}</textarea>
<button class="btn success" onclick="saveSettings()">${st("saveSettings")}</button>
`;
const selector=document.getElementById("shopkeeperLanguage"); if(selector) selector.value=shopkeeperLanguage;
}

window.saveSettings = async function(){

const uid = auth.currentUser.uid;

await updateDoc(
doc(db,"users",uid),
{
shopName:
document.getElementById(
"shopNameInput"
).value,

ownerName:
document.getElementById(
"ownerNameInput"
).value,

phone:
document.getElementById(
"phoneInput"
).value,

address:
document.getElementById(
"addressInput"
).value
}
);

alert(st("settingsSaved"));

};

renderOrders();

</script>

</body>
</html>
