<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OnShop Shopkeeper Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#111827;
color:#fff;
position:fixed;
left:0;
top:0;
bottom:0;
padding:20px;
overflow:auto;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:25px;
}

.menu button{
width:100%;
padding:14px;
border:none;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
background:#1f2937;
color:white;
text-align:left;
font-size:15px;
}

.menu button:hover{
background:#2563eb;
}

.main{
margin-left:260px;
width:100%;
padding:25px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.shopTitle{
font-size:28px;
font-weight:700;
}

.status{
padding:8px 15px;
border-radius:25px;
font-size:13px;
font-weight:600;
}

.approved{
background:#dcfce7;
color:#166534;
}

.pending{
background:#fef3c7;
color:#92400e;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h4{
color:#666;
margin-bottom:10px;
}

.card h2{
font-size:30px;
}

.page{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{
display:none;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

.btn{
padding:8px 14px;
border:none;
border-radius:10px;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#16a34a;
color:white;
}

.danger{
background:#dc2626;
color:white;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:8px;
margin-bottom:15px;
}

</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
🛒 OnShop
</div>

<div class="menu">

<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>

<button onclick="showPage('products')">
📦 Products
</button>

<button onclick="showPage('orders')">
🛍 Orders
</button>

<button onclick="showPage('customers')">
👥 Customers
</button>

<button onclick="showPage('analytics')">
📈 Analytics
</button>

<button onclick="showPage('settings')">
⚙ Settings
</button>

<button onclick="logoutUser()">
🚪 Logout
</button>

</div>

</div>

<div class="main">

<div class="header">

<div class="shopTitle" id="shopName">
Loading...
</div>

<div id="approvalBadge" class="status pending">
Pending
</div>

</div>

<div id="dashboardPage">

<div class="cards">

<div class="card">
<h4>Total Products</h4>
<h2 id="totalProducts">0</h2>
</div>

<div class="card">
<h4>Total Customers</h4>
<h2 id="totalCustomers">0</h2>
</div>

<div class="card">
<h4>Total Sales</h4>
<h2 id="totalSales">0</h2>
</div>

<div class="card">
<h4>Revenue</h4>
<h2 id="totalRevenue">₹0</h2>
</div>

</div>

<div class="page">

<h2>Welcome to OnShop</h2>
<br>
<p>
Manage products, orders and customers from one dashboard.
</p>

</div>

</div>

<div id="productsPage" class="page hidden"></div>

<div id="ordersPage" class="page hidden"></div>

<div id="customersPage" class="page hidden"></div>

<div id="analyticsPage" class="page hidden"></div>

<div id="settingsPage" class="page hidden"></div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDObJ8UKlYL_M4qHmJiWgxlNJraqmDZwGc",
authDomain: "shophelpay.firebaseapp.com",
projectId: "shophelpay",
storageBucket: "shophelpay.firebasestorage.app",
messagingSenderId: "714326373961",
appId: "1:714326373961:web:7df87c2fb87f08e69e7198"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let shopData = {};
let userData = {};
let products = [];
let customers = [];
let sales = [];

window.logoutUser = async function(){
await signOut(auth);
location.href="shopkeeper-login.html";
};

window.showPage = function(page){

document.getElementById("dashboardPage").classList.add("hidden");
document.getElementById("productsPage").classList.add("hidden");
document.getElementById("ordersPage").classList.add("hidden");
document.getElementById("customersPage").classList.add("hidden");
document.getElementById("analyticsPage").classList.add("hidden");
document.getElementById("settingsPage").classList.add("hidden");

document.getElementById(page+"Page")
.classList.remove("hidden");

};

async function loadShop(){

const uid = auth.currentUser.uid;

const userSnap =
await getDoc(doc(db,"users",uid));

if(!userSnap.exists()){

alert("User not found");
return;

}

userData = userSnap.data();

if(userData.role !== "shopkeeper"){

alert("Access denied");
location.href="index.html";
return;

}

document.getElementById("shopName")
.innerText =
userData.shopName || "My Shop";

if(userData.status === "approved"){

document.getElementById("approvalBadge")
.innerText = "Approved";

document.getElementById("approvalBadge")
.className =
"status approved";

}else{

document.getElementById("approvalBadge")
.innerText = "Pending";

}

const shopSnap =
await getDoc(doc(db,"shops",uid));

if(shopSnap.exists()){

shopData = shopSnap.data();

products =
shopData.products || [];

customers =
shopData.customers || [];

sales =
shopData.sales || [];

}

updateDashboard();
renderProducts();
renderCustomers();
renderAnalytics();
renderOrders();
renderSettings();

}

onAuthStateChanged(auth, async(user)=>{

if(!user){

location.href="shopkeeper-login.html";
return;

}

await loadShop();

});

function updateDashboard(){

document.getElementById("totalProducts")
.innerText =
products.length;

document.getElementById("totalCustomers")
.innerText =
customers.length;

document.getElementById("totalSales")
.innerText =
sales.length;

let revenue = 0;

sales.forEach(s=>{

revenue += Number(
s.total || 0
);

});

document.getElementById("totalRevenue")
.innerText =
"₹"+revenue;

}
function renderProducts(){

let html = `

<h2>Products</h2>

<br>

<table>

<tr>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
<th>OnShop</th>
<th>Action</th>
</tr>

`;

products.forEach((p,index)=>{

html += `

<tr>

<td>${p.name || "-"}</td>

<td>₹${p.sp || 0}</td>

<td>${p.qty || 0}</td>

<td>
${p.onshopEnabled ? "✅ Live" : "❌ Off"}
</td>

<td>

<button
class="btn primary"
onclick="toggleProduct(${index})">

${p.onshopEnabled ? "Disable" : "Enable"}

</button>

</td>

</tr>

`;

});

html += `</table>`;

document.getElementById(
"productsPage"
).innerHTML = html;

}

window.toggleProduct = async function(index){

const uid = auth.currentUser.uid;

products[index].onshopEnabled =
!products[index].onshopEnabled;

await updateDoc(
doc(db,"shops",uid),
{
products
}
);

renderProducts();

};

function renderCustomers(){

let html = `

<h2>Customers</h2>

<br>

<table>

<tr>
<th>Name</th>
<th>Phone</th>
<th>Debt</th>
</tr>

`;

customers.forEach(c=>{

html += `

<tr>

<td>${c.name || "-"}</td>

<td>${c.phone || "-"}</td>

<td>₹${c.debt || 0}</td>

</tr>

`;

});

html += `</table>`;

document.getElementById(
"customersPage"
).innerHTML = html;

}

function renderAnalytics(){

let revenue = 0;

sales.forEach(s=>{

revenue += Number(
s.total || 0
);

});

document.getElementById(
"analyticsPage"
).innerHTML = `

<h2>Analytics</h2>

<br>

<div class="cards">

<div class="card">

<h4>Total Revenue</h4>

<h2>₹${revenue}</h2>

</div>

<div class="card">

<h4>Total Sales</h4>

<h2>${sales.length}</h2>

</div>

<div class="card">

<h4>Products</h4>

<h2>${products.length}</h2>

</div>

</div>

`;

}
function renderOrders(){

document.getElementById(
"ordersPage"
).innerHTML = `

<h2>Orders</h2>

<br>

<div class="card">

<h3>
No orders yet
</h3>

<p>
Orders from OnShop customers will appear here.
</p>

</div>

`;

}

function renderSettings(){

document.getElementById(
"settingsPage"
).innerHTML = `

<h2>Store Settings</h2>

<br>

<label>Shop Name</label>

<input
id="shopNameInput"
value="${userData.shopName || ""}">

<label>Owner Name</label>

<input
id="ownerNameInput"
value="${userData.ownerName || ""}">

<label>Phone</label>

<input
id="phoneInput"
value="${userData.phone || ""}">

<label>Address</label>

<textarea
id="addressInput">${userData.address || ""}</textarea>

<button
class="btn success"
onclick="saveSettings()">

Save Settings

</button>

`;

}

window.saveSettings = async function(){

const uid = auth.currentUser.uid;

await updateDoc(
doc(db,"users",uid),
{
shopName:
document.getElementById(
"shopNameInput"
).value,

ownerName:
document.getElementById(
"ownerNameInput"
).value,

phone:
document.getElementById(
"phoneInput"
).value,

address:
document.getElementById(
"addressInput"
).value
}
);

alert("Settings Saved");

};

renderOrders();

</script>

</body>
</html>
